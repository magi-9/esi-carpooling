# --- Spring Boot Application ---
server.port=8086
spring.application.name=auth

# --- Database Configuration ---
# If running locally via IDE (not Docker), it uses localhost.
# Inside Docker, the environment variables will override this.
spring.datasource.url=jdbc:postgresql://auth-postgres-db:5432/auth_db
spring.datasource.username=${AUTH_DB_USER:default_user}
spring.datasource.password=${AUTH_DB_PASSWORD:default_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Apache Kafka Configuration ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.fail-fast=true
spring.kafka.admin.properties.request.timeout.ms=2000
spring.kafka.admin.properties.default.api.timeout.ms=2000

# --- Custom JWT Configuration ---
# Must be provided by Docker/.env or environment variable
jwt.secret=${AUTH_JWT_SECRET}
jwt.expiration=86400000
