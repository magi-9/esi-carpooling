services:
  profile-db:
    image: postgres:16-alpine
    container_name: esi-profile-db
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: ${PROFILE_DB_USER}
      POSTGRES_PASSWORD: ${PROFILE_DB_PASSWORD}
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - esi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROFILE_DB_USER} -d profile_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  profile-service:
    build: .
    container_name: esi-profile-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://profile-db:5432/profile_db
      - SPRING_DATASOURCE_USERNAME=${PROFILE_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${PROFILE_DB_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET=${JWT_SECRET}
      - VALIDATION_SERVICE_URL=http://esi-validation-service:8080
    restart: unless-stopped
    networks:
      - esi-network
    depends_on:
      profile-db:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  profile-db-data:
