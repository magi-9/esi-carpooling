
# Database Settings
spring.datasource.url=jdbc:postgresql://localhost:5432/esi2023
spring.datasource.username=postgres
spring.datasource.password=postgres



# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
# Allows for auto creation of tables
spring.jpa.hibernate.ddl-auto = update

# Initialize test data on startup (for demo purposes)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
# Must match the secret used by auth-service (base64 encoded)
jwt.secret=${JWT_SECRET:c2VjcmV0}

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=ride-booking-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.esi.payment.event
spring.kafka.consumer.properties.spring.json.type.mapping=com.esi.payment.event.PaymentSuccessfulEvent:com.esi.ridebooking.event.PaymentSuccessfulEvent,com.esi.payment.event.PaymentRefundedEvent:com.esi.ridebooking.event.PaymentRefundedEvent