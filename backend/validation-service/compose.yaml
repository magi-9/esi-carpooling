version: "3.9"

services:
  validation-service:
    build: .
    container_name: esi-validation-service
    restart: unless-stopped
    ports:
      - 8080:8080
    depends_on:
      - postgres_db
    environment:
      - spring.datasource.url=jdbc:postgresql://postgres_db:5432/validationdb
      - spring.datasource.username=postgres
      - spring.datasource.password=admin
  postgres_db:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=validationdb'
      - 'POSTGRES_PASSWORD=admin'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
