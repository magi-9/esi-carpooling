spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Disable external service calls during tests
auth.service.url=http://localhost:8081
payment.service.url=http://localhost:8083
geocoding.service.url=http://localhost:8085

# Disable data.sql initialization in tests (H2 doesn't support PostgreSQL syntax)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
