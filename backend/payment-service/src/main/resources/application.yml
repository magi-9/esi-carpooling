spring:
    application:
        name: payment-service
    datasource:
        url: ${DB_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE}
        username: ${DB_USERNAME:sa}
        password: ${DB_PASSWORD:}
        driver-class-name: ${DB_DRIVER:org.h2.Driver}
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    h2:
        console:
            enabled: true
            path: /h2-console
    sql:
        init:
            mode: always
            schema-locations: classpath:schema.sql
    kafka:
        bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
    port: ${PORT:8081}

clients:
    booking-service-url: ${BOOKING_SERVICE_URL:http://localhost:8083}
