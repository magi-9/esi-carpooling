version: "3.9"

services:
  geolocation-service:
    build: .
    container_name: esi-geolocation-service
    restart: unless-stopped
    ports:
      - 8088:8080
    environment:
      - NOMINATIM_USER_AGENT=esi-geolocation-service/0.1 (dev@localhost)
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - esi-network